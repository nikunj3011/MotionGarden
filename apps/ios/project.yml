name: MotionGarden
options:
  bundleIdPrefix: art.motiongarden
  deploymentTarget:
    iOS: '17.0'
targets:
  MotionGarden:
    type: application
    platform: iOS
    sources:
      - path: MotionGarden
        excludes: [bundle]
    resources:
      - path: MotionGarden/bundle
        type: folder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        PRODUCT_BUNDLE_IDENTIFIER: art.motiongarden.app
